<html>
<head>

<title>Kyle Hoppmann — Keldrin LLC</title>

<body>
<!-- ============================================================
     Keldrin LLC email signature — Kyle Hoppmann
     Table-based, inline CSS only. Safe for Outlook (Word engine),
     Outlook on the web, and Gmail. Images are hosted at keldrin.co
     and must stay there for the signature to render.

     Three things are deliberate and will look like mistakes:
     1. "FOUNDER · KELDRIN LLC" is typed in capitals rather than set
        with text-transform — new Outlook drops the CSS property.
     2. The phone number uses non-breaking hyphens (&#8209;), not
        regular ones, so Gmail's phone detector does not match it and
        restyle it as a blue underlined link.
     3. The rule above the signature is a bgcolor table cell propped
        open by a 1x1 spacer image, not a border or an <hr>.
     ============================================================ -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;">
  <tr>

    <!-- Separator rule: sets the signature off from the message body -->
    <td style="padding:0 0 20px 0;font-size:0;line-height:0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;width:100%;mso-table-lspace:0pt;mso-table-rspace:0pt;">
        <tr>
          <td height="1" bgcolor="#D5D9DF" style="height:1px;line-height:1px;font-size:0;background-color:#D5D9DF;">
            <img src="https://keldrin.co/assets/signature/spacer.png" width="1" height="1" alt="" style="display:block;width:1px;height:1px;border:0;outline:none;">
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding:0;">

      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;font-family:Arial,Helvetica,sans-serif;color:#2C3441;">
        <tr>

          <!-- Headshot -->
          <td width="96" valign="middle" style="width:96px;padding:0;">
            <img src="https://keldrin.co/assets/signature/headshot-192.png" width="96" height="96" alt="Kyle Hoppmann" style="display:block;width:96px;height:96px;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;">
          </td>

          <!-- Gap -->
          <td width="18" style="width:18px;font-size:0;line-height:0;">&nbsp;</td>

          <!-- Gold rule -->
          <td width="1" bgcolor="#E6BD69" style="width:1px;background-color:#E6BD69;font-size:0;line-height:0;">
            <img src="https://keldrin.co/assets/signature/spacer.png" width="1" height="120" alt="" style="display:block;width:1px;height:120px;border:0;outline:none;">
          </td>

          <!-- Gap -->
          <td width="18" style="width:18px;font-size:0;line-height:0;">&nbsp;</td>

          <!-- Name, title, contact -->
          <td valign="top" style="padding:0;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;">
              <tr>
                <td style="font-family:Arial,Helvetica,sans-serif;font-size:17px;line-height:21px;font-weight:bold;color:#2C3441;padding:0 0 3px 0;">Kyle Hoppmann</td>
              </tr>
              <tr>
                <td style="font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:15px;font-weight:bold;color:#55606F;letter-spacing:0.8px;padding:0 0 11px 0;">FOUNDER &nbsp;&middot;&nbsp; KELDRIN LLC</td>
              </tr>

              <!-- Phone -->
              <tr>
                <td style="padding:0;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;">
                    <tr>
                      <td width="14" valign="middle" style="width:14px;padding:0 9px 0 0;line-height:0;">
                        <img src="https://keldrin.co/assets/signature/icon-phone-28.png" width="14" height="14" alt="Phone" style="display:block;width:14px;height:14px;border:0;outline:none;-ms-interpolation-mode:bicubic;">
                      </td>
                      <td valign="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#2C3441;">
                        <a href="tel:+12704772582" style="color:#2C3441;text-decoration:none;"><span style="color:#2C3441;text-decoration:none;">270&#8209;477&#8209;2582</span></a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- Email -->
              <tr>
                <td style="padding:5px 0 0 0;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;">
                    <tr>
                      <td width="14" valign="middle" style="width:14px;padding:0 9px 0 0;line-height:0;">
                        <img src="https://keldrin.co/assets/signature/icon-email-28.png" width="14" height="14" alt="Email" style="display:block;width:14px;height:14px;border:0;outline:none;-ms-interpolation-mode:bicubic;">
                      </td>
                      <td valign="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#2C3441;">
                        <a href="mailto:hopp@keldrin.co" style="color:#2C3441;text-decoration:none;"><span style="color:#2C3441;text-decoration:none;">hopp@keldrin.co</span></a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <!-- Website -->
              <tr>
                <td style="padding:5px 0 0 0;">
                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;">
                    <tr>
                      <td width="14" valign="middle" style="width:14px;padding:0 9px 0 0;line-height:0;">
                        <img src="https://keldrin.co/assets/signature/icon-web-28.png" width="14" height="14" alt="Website" style="display:block;width:14px;height:14px;border:0;outline:none;-ms-interpolation-mode:bicubic;">
                      </td>
                      <td valign="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:20px;color:#2C3441;">
                        <a href="https://keldrin.co" style="color:#2C3441;text-decoration:none;"><span style="color:#2C3441;text-decoration:none;">keldrin.co</span></a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>

          <!-- Gap -->
          <td width="22" style="width:22px;font-size:0;line-height:0;">&nbsp;</td>

          <!-- Logo mark -->
          <td width="44" valign="top" style="width:44px;padding:2px 0 0 0;">
            <a href="https://keldrin.co" style="text-decoration:none;border:0;"><img src="https://keldrin.co/assets/signature/keldrin-mark-88.png" width="44" height="44" alt="Keldrin" style="display:block;width:44px;height:44px;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;"></a>
          </td>

        </tr>
      </table>

    </td>
  </tr>
</table>
</body>
